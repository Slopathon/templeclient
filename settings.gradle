pluginManagement {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.kikugie.dev/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
}
plugins {
	id 'dev.kikugie.stonecutter' version '0.7.11'
}
stonecutter {
	create(rootProject) {
		versions '26.2'
		vcsVersion = '26.2'
	}
}
rootProject.name = 'temple-client'
