<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#0B0D11"/>
  <defs>
    <g id="mark">
      <!-- Pediment: one chevron, thick enough that the inner edge survives at 16px. -->
      <path d="M64 4 L126 50 L126 68 L64 24 L2 68 L2 50 Z" fill="#E9B949"/>
      <!-- Entablature: the crossbar of the T. -->
      <path d="M12 72 L116 72 L116 88 L12 88 Z" fill="#E9B949"/>
      <!-- Centre stem, ending in a spearhead. -->
      <path d="M54 88 L74 88 L74 108 L64 124 L54 108 Z" fill="#E9B949"/>
      <!-- Right column: intact, with a clipped foot so it is not a plain rectangle. -->
      <path d="M92 88 L112 88 L112 106 L104 114 L92 114 Z" fill="#E9B949"/>
      <!-- Left column: collapsed. Angular facets, not noise, so it reads as broken stone. -->
      <path d="M16 88 L36 88 L36 100 L30 100 L30 107 L22 107 L22 99 L16 99 Z" fill="#E9B949"/>
      <path d="M24 110 L31 110 L31 116 L24 116 Z" fill="#E9B949"/>
      <path d="M33 118 L38 118 L38 123 L33 123 Z" fill="#E9B949"/>
      <path d="M18 120 L22 120 L22 124 L18 124 Z" fill="#E9B949"/>
    </g>
  </defs>

  <use href="#mark" transform="translate(30,72)"/>
  <text x="30" y="246" font-family="Inter,sans-serif" font-size="13" fill="#5A6070">vector redraw</text>

  <g transform="translate(200,118)"><use href="#mark" transform="scale(0.5)"/></g>
  <g transform="translate(200,200)"><use href="#mark" transform="scale(0.25)"/></g>
  <g transform="translate(200,246)"><use href="#mark" transform="scale(0.125)"/></g>
  <text x="272" y="176" font-family="Inter,sans-serif" font-size="12" fill="#5A6070">64px</text>
  <text x="240" y="222" font-family="Inter,sans-serif" font-size="12" fill="#5A6070">32px</text>
  <text x="222" y="258" font-family="Inter,sans-serif" font-size="12" fill="#5A6070">16px</text>

  <text x="330" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#E9B949" letter-spacing="-1">TEMPLE<tspan fill="#6F7686">.NZ</tspan></text>
  <text x="332" y="186" font-family="Inter,sans-serif" font-size="14" fill="#6F7686" letter-spacing="3">ANARCHY CLIENT</text>
  <text x="330" y="246" font-family="Inter,sans-serif" font-size="13" fill="#5A6070">chips are deliberate facets; roof band widened</text>
</svg>
